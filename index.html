<script>
  const stampTxt = () => {};
  onLang(() => { document.getElementById("next-when").textContent = L(MUN.next.short); stampTxt(); });
  MUNRender.placard(document.getElementById("placard"));
  const ap = window.applyLang; window.applyLang = () => { ap(); MUNRender.placard(document.getElementById("placard")); document.getElementById("next-when").textContent = L(MUN.next.short); stampTxt(); };

  // Печать Генерального секретаря: тексты на языке страницы, по клику ставится заново
  const sealTxt = () => { const en = LANG === "en";
    document.getElementById("seal-ring").textContent = en ? "SECRETARY-GENERAL · LSU MODEL UNITED NATIONS · " : "ГЕНЕРАЛЬНЫЙ СЕКРЕТАРЬ · МОДЕЛЬ ООН ННГУ · ";
    document.getElementById("seal-big").textContent = en ? "ADOPTED" : "ПРИНЯТО";
    document.getElementById("seal-top").textContent = en ? "RESOLUTION" : "РЕЗОЛЮЦИЯ";
    document.getElementById("seal-bot").textContent = "LSU MUN"; };
  sealTxt(); const ap2 = window.applyLang; window.applyLang = () => { ap2(); sealTxt(); };
  document.querySelectorAll(".seal").forEach((v) => v.addEventListener("click", () => { v.classList.remove("hit"); void v.offsetWidth; v.classList.add("hit"); }));
</script>
